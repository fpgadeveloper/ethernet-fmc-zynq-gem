# Drop-in for wpa_supplicant@wlan0.service (stock template from wpa-supplicant).
[Unit]
# Nothing to do until the operator has written the credentials file.
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-wlan0.conf

[Service]
Restart=on-failure
RestartSec=5
# Raise wlan0 (WILC3000 firmware download + start) before the supplicant
# runs, with one retry: a failed firmware start is cleaned up by the driver
# and the next attempt normally succeeds. Best effort ("-"): wpa_supplicant
# raises the interface itself as well.
ExecStartPre=-/bin/sh -c 'ip link set %I up || { sleep 2; ip link set %I up; }'
# cfg80211 defaults to power save on (CONFIG_CFG80211_DEFAULT_PS=y); the
# WILC3000 sleep/wake path adds latency and is the least-proven part of the
# driver, so keep the radio awake. Best effort ("-"): never fail the unit.
ExecStartPost=-/bin/sh -c 'sleep 2; /usr/sbin/iw dev %I set power_save off'
